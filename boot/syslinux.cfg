# BIOS boot (syslinux). The BEL in the message beeps through the BIOS as soon
# as the loader runs: the first sign the stick was chosen.
DEFAULT talk
PROMPT 0
TIMEOUT 10
SAY Talking Alpine: booting in one second.
SAY 

LABEL talk
  KERNEL /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND modules=loop,squashfs,sd-mod,usb-storage,vfat,ext4 quiet

LABEL verbose
  KERNEL /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND modules=loop,squashfs,sd-mod,usb-storage,vfat,ext4
