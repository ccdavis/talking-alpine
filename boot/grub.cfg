# UEFI boot (grub). `play` only exists on BIOS builds of grub, where syslinux
# is used instead, so there is no chime here: the first sound is the ALSA
# ready chime once the kernel has found the sound card.
set timeout=1
set default=0
insmod all_video

menuentry "Talking Alpine" {
    linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage,vfat,ext4 quiet
    initrd /boot/initramfs-lts
}
menuentry "Talking Alpine (verbose)" {
    linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage,vfat,ext4
    initrd /boot/initramfs-lts
}
