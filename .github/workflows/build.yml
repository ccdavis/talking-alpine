name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, x86]
    env:
      ARCH: ${{ matrix.arch }}
      PODMAN: docker
    steps:
      - uses: actions/checkout@v4
      - name: rust-tdsr
        run: git clone --depth 1 https://github.com/ccdavis/rust-tdsr "$HOME/rust-tdsr"
      - name: host tools
        run: sudo apt-get install -y -q xorriso zip
      - name: sources (Alpine ISO, espeakup, DECtalk)
        run: bash run/get-alpine.sh
      - name: tdsr (musl, dectalk) and espeakup
        run: bash run/build.sh
      - name: image
        run: bash run/mkimage.sh && find dist -type f | xargs ls -la
      - name: zip
        run: cd dist/$ARCH && for f in talkalpine*.img; do zip -q -9 "$f.zip" "$f"; done && sha256sum *.zip tdsr espeakup > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: talkalpine-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.zip
            dist/${{ matrix.arch }}/tdsr
            dist/${{ matrix.arch }}/espeakup
            dist/${{ matrix.arch }}/SHA256SUMS
